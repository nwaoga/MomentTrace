<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">MomentTrace timeline and detail preview</title>
  <desc id="desc">Sanitized preview of the Avalonia timeline with card mode, deferred previews, expandable screenshots, grouped sessions, and the contextual detail pane.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111F"/>
      <stop offset="1" stop-color="#0B1628"/>
    </linearGradient>
    <linearGradient id="shot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0E7FF"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1400" height="820" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="48" y="40" width="1304" height="740" rx="22" fill="#08111F" stroke="#26344D" stroke-width="2"/>
  </g>

