<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">MomentTrace Avalonia shell preview</title>
  <desc id="desc">A sanitized preview of the MomentTrace Avalonia desktop shell showing the timeline, cards, list mode, top command bar, and detail pane.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03140f"/>
      <stop offset="0.55" stop-color="#082219"/>
      <stop offset="1" stop-color="#061713"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00d889"/>
      <stop offset="1" stop-color="#007a4f"/>
    </linearGradient>
    <linearGradient id="shot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7fff0"/>
      <stop offset="0.4" stop-color="#7be0c4"/>
      <stop offset="1" stop-color="#164f3f"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#56dba3" stroke-opacity="0.055" stroke-width="1"/>
      <circle cx="8" cy="8" r="1.5" fill="#56dba3" fill-opacity="0.08"/>
    </pattern>
  </defs>

