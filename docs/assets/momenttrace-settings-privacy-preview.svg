<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">MomentTrace in-shell Settings preview</title>
  <desc id="desc">A sanitized preview of the current MomentTrace in-shell Settings page showing sections, app health, privacy controls, local data actions, and build identity.</desc>
