<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">MomentTrace Settings privacy preview</title>
  <desc id="desc">A sanitized preview of the MomentTrace Settings modal showing appearance controls, immediate privacy exclusions, and local data actions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061713"/>
      <stop offset="1" stop-color="#0d221b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#082219"/>
      <stop offset="1" stop-color="#061713"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
    <pattern id="dots" width="42" height="42" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.4" fill="#00d889" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1200" height="620" fill="url(#bg)"/>
  <rect width="1200" height="620" fill="url(#dots)"/>
  <circle cx="1000" cy="90" r="220" fill="#00d889" opacity="0.08"/>
  <circle cx="160" cy="550" r="190" fill="#0ea5e9" opacity="0.08"/>

  <g filter="url(#shadow)">
    <rect x="92" y="48" width="1016" height="524" rx="22" fill="url(#panel)" stroke="#245342" stroke-width="2"/>
  </g>
  <rect x="124" y="78" width="952" height="64" rx="16" fill="#082219" stroke="#00a862" stroke-width="2"/>
  <rect x="150" y="96" width="32" height="32" rx="9" fill="#0d2c22" stroke="#245342"/>
  <text x="166" y="118" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" fill="#00d889">MT</text>
  <text x="202" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="#f1fff8">Settings</text>
  <rect x="1018" y="90" width="42" height="42" rx="11" fill="#061713" stroke="#00a862"/>
  <text x="1039" y="118" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#f1fff8">x</text>

  <text x="144" y="194" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#f1fff8">Settings</text>
  <text x="144" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#9ff5cf">Control startup, recording, appearance, privacy, and local storage paths.</text>

  <rect x="144" y="270" width="312" height="170" rx="16" fill="#082219" stroke="#245342"/>
  <text x="170" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="#f1fff8">Appearance</text>
  <text x="170" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9cc8b7">Theme</text>
  <rect x="274" y="322" width="150" height="38" rx="10" fill="#061713" stroke="#00a862"/>
  <text x="296" y="346" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#f1fff8">Amazon Green</text>
  <text x="170" y="392" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9cc8b7">Timeline view</text>
  <rect x="274" y="372" width="150" height="38" rx="10" fill="#061713" stroke="#00a862"/>
  <text x="296" y="396" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#f1fff8">Cards / List</text>

  <rect x="486" y="270" width="390" height="292" rx="16" fill="#082219" stroke="#245342"/>
  <text x="512" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="#f1fff8">Privacy filters</text>
  <text x="512" y="335" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9ff5cf">App and website exclusions save immediately.</text>

  <rect x="512" y="364" width="334" height="50" rx="10" fill="#061713" stroke="#00a862" stroke-width="2"/>
  <rect x="530" y="381" width="18" height="18" rx="4" fill="#00a862" stroke="#00d889"/>
  <path d="M534 390l5 5 10-12" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="564" y="391" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#f1fff8">Video editor</text>
  <text x="564" y="407" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9cc8b7">videoeditor · 18 entries</text>

  <rect x="512" y="430" width="334" height="50" rx="10" fill="#061713" stroke="#245342"/>
  <rect x="530" y="447" width="18" height="18" rx="4" fill="#061713" stroke="#9cc8b7"/>
  <text x="564" y="457" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#f1fff8">Design tool</text>
  <text x="564" y="473" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9cc8b7">designapp · 9 entries</text>

  <rect x="512" y="496" width="334" height="50" rx="10" fill="#061713" stroke="#00a862" stroke-width="2"/>
  <rect x="530" y="513" width="18" height="18" rx="4" fill="#00a862" stroke="#00d889"/>
  <path d="M534 522l5 5 10-12" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="564" y="523" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#f1fff8">example.local</text>
  <text x="564" y="539" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9cc8b7">website · 12 entries</text>

  <rect x="906" y="270" width="220" height="292" rx="16" fill="#082219" stroke="#245342"/>
  <text x="932" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="#f1fff8">Local data</text>
  <text x="932" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9ff5cf">Database</text>
  <text x="932" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#f1fff8">timeline.db</text>
  <line x1="932" y1="392" x2="1098" y2="392" stroke="#245342"/>
  <text x="932" y="424" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9ff5cf">Previews</text>
  <text x="932" y="449" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#f1fff8">screenshots/</text>
  <rect x="932" y="490" width="134" height="42" rx="10" fill="#3d1f2c" stroke="#8e3755"/>
  <text x="999" y="516" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Delete local</text>
</svg>
