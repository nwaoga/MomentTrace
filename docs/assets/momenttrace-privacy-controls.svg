  <text x="96" y="140" fill="#A5B0C3" font-family="Segoe UI, Arial, sans-serif" font-size="18">Choose what MomentTrace should skip before it is saved locally.</text>

  <rect x="96" y="184" width="336" height="396" rx="18" fill="#172337" stroke="#34425C"/>
  <text x="128" y="232" fill="#F4F7FB" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Recent apps</text>
  <text x="128" y="260" fill="#A5B0C3" font-family="Segoe UI, Arial, sans-serif" font-size="15">Tick apps to block future captures.</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="18">
