<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" rx="28" fill="#08111F"/>
  <rect x="56" y="48" width="1168" height="624" rx="24" fill="#121D2F" stroke="#26344D"/>
