    <rect x="128" y="456" width="272" height="58" rx="12" fill="#101A2B" stroke="#26344D"/>
    <rect x="150" y="475" width="20" height="20" rx="5" fill="#0B1424" stroke="#526179"/>
    <text x="184" y="492" fill="#F4F7FB" font-weight="600">VS Code</text>
  </g>

  <rect x="472" y="184" width="336" height="396" rx="18" fill="#172337" stroke="#34425C"/>
  <text x="504" y="232" fill="#F4F7FB" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Recent websites</text>
  <text x="504" y="260" fill="#A5B0C3" font-family="Segoe UI, Arial, sans-serif" font-size="15">Block domains without typing them.</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="18">
    <rect x="504" y="304" width="272" height="58" rx="12" fill="#231B42" stroke="#8B5CF6"/>
