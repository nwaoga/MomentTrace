name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version }}" } else { "${{ github.ref_name }}" }
          $versionMatch = [regex]::Match($tag, '^v(?<base>\d+\.\d+\.\d+)(?<suffix>-[0-9A-Za-z][0-9A-Za-z.-]*)?$')
          if (-not $versionMatch.Success) {
            throw "Version must use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease format, for example v0.1.0 or v0.1.1-beta.1."
          }

          $version = $versionMatch.Groups["base"].Value
          $suffix = $versionMatch.Groups["suffix"].Value
          $packageLabel = "$version$suffix"
          $isPrerelease = -not [string]::IsNullOrWhiteSpace($suffix)
          $artifactName = "MomentTrace-$packageLabel-win-x64"
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PACKAGE_LABEL=$packageLabel" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_IS_PRERELEASE=$isPrerelease" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ARTIFACT_NAME=$artifactName" | Out-File -FilePath $env:GITHUB_ENV -Append
          "release_tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "package_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "package_label=$packageLabel" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "artifact_name=$artifactName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "is_prerelease=$isPrerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Import Windows signing certificate
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_PASSWORD)) {
            Write-Host "Windows signing secrets are not configured; release artifacts will be unsigned."
            return
          }

          $certPath = Join-Path $env:RUNNER_TEMP "momenttrace-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_SIGNING_PFX_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          "WINDOWS_SIGNING_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Remove-Item -LiteralPath $certPath -Force

      - name: Restore
        run: dotnet restore .\MomentTrace.App\MomentTrace.App.csproj --runtime win-x64

      - name: Publish Windows app
        run: >
          dotnet publish .\MomentTrace.App\MomentTrace.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.package_version }}
          -p:AssemblyVersion=${{ steps.version.outputs.package_version }}.0
          -p:FileVersion=${{ steps.version.outputs.package_version }}.0
          -p:InformationalVersion=${{ steps.version.outputs.release_tag }}
          --output .\artifacts\${{ steps.version.outputs.artifact_name }}

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\dist | Out-Null
          Compress-Archive -Path ".\artifacts\${{ steps.version.outputs.artifact_name }}\*" -DestinationPath ".\dist\${{ steps.version.outputs.artifact_name }}.zip" -Force

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Package installer
        shell: pwsh
        run: |
          $signingArgs = @()
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_THUMBPRINT)) {
            $signingArgs += @(
              "-CertificateThumbprint", $env:WINDOWS_SIGNING_CERT_THUMBPRINT
            )
          }

          .\scripts\build-installer.ps1 `
            -Version "${{ steps.version.outputs.package_label }}" `
            -AssemblyVersion "${{ steps.version.outputs.package_version }}" `
            -PublishDir ".\artifacts\${{ steps.version.outputs.artifact_name }}" `
            -OutputDir ".\dist" `
            @signingArgs

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: |
            .\dist\${{ steps.version.outputs.artifact_name }}.zip
            .\dist\MomentTrace-${{ steps.version.outputs.package_label }}-win-x64-setup.exe

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          MomentTrace ${{ steps.version.outputs.release_tag }}

          Download the Windows installer below to install MomentTrace into Program Files.
          The portable zip is also attached if you prefer to extract and run MomentTrace.App.exe directly.
          "@

          $releaseArgs = @()
          if ("${{ steps.version.outputs.is_prerelease }}" -eq "True") {
            $releaseArgs += "--prerelease"
          }

          gh release create "${{ steps.version.outputs.release_tag }}" ".\dist\MomentTrace-${{ steps.version.outputs.package_label }}-win-x64-setup.exe" ".\dist\${{ steps.version.outputs.artifact_name }}.zip" `
            --title "MomentTrace ${{ steps.version.outputs.release_tag }}" `
            --notes $notes `
            --target "${{ github.sha }}" `
            @releaseArgs
