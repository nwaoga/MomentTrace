name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version }}" } else { "${{ github.ref_name }}" }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Version must use vMAJOR.MINOR.PATCH format, for example v0.1.0."
          }

          $version = $tag.TrimStart('v')
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ARTIFACT_NAME=MomentTrace-$version-win-x64" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Import Windows signing certificate
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_PASSWORD)) {
            Write-Host "Windows signing secrets are not configured; release artifacts will be unsigned."
            return
          }

          $certPath = Join-Path $env:RUNNER_TEMP "momenttrace-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_SIGNING_PFX_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          "WINDOWS_SIGNING_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Remove-Item -LiteralPath $certPath -Force

      - name: Restore
        run: dotnet restore .\MomentTrace.App\MomentTrace.App.csproj --runtime win-x64

      - name: Publish Windows app
        run: >
          dotnet publish .\MomentTrace.App\MomentTrace.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ env.PACKAGE_VERSION }}
          -p:AssemblyVersion=${{ env.PACKAGE_VERSION }}.0
          -p:FileVersion=${{ env.PACKAGE_VERSION }}.0
          -p:InformationalVersion=${{ env.RELEASE_TAG }}
          --output .\artifacts\${{ env.ARTIFACT_NAME }}

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\dist | Out-Null
          Compress-Archive -Path ".\artifacts\${{ env.ARTIFACT_NAME }}\*" -DestinationPath ".\dist\${{ env.ARTIFACT_NAME }}.zip" -Force

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Package installer
        shell: pwsh
        run: |
          $signingArgs = @()
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_THUMBPRINT)) {
            $signingArgs += @(
              "-CertificateThumbprint", $env:WINDOWS_SIGNING_CERT_THUMBPRINT
            )
          }

          .\scripts\build-installer.ps1 `
            -Version "${{ env.PACKAGE_VERSION }}" `
            -PublishDir ".\artifacts\${{ env.ARTIFACT_NAME }}" `
            -OutputDir ".\dist" `
            @signingArgs

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            .\dist\${{ env.ARTIFACT_NAME }}.zip
            .\dist\MomentTrace-${{ env.PACKAGE_VERSION }}-win-x64-setup.exe

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          MomentTrace ${{ env.RELEASE_TAG }}

          Download the Windows installer below to install MomentTrace into Program Files.
          The portable zip is also attached if you prefer to extract and run MomentTrace.App.exe directly.
          "@

          gh release create "${{ env.RELEASE_TAG }}" ".\dist\MomentTrace-${{ env.PACKAGE_VERSION }}-win-x64-setup.exe" ".\dist\${{ env.ARTIFACT_NAME }}.zip" `
            --title "MomentTrace ${{ env.RELEASE_TAG }}" `
            --notes $notes `
            --target "${{ github.sha }}"
