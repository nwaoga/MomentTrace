name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.1.0 or v0.1.1-beta.6"
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      package_version: ${{ steps.version.outputs.package_version }}
      package_label: ${{ steps.version.outputs.package_label }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      windows_artifact_name: ${{ steps.version.outputs.windows_artifact_name }}
      macos_artifact_name: ${{ steps.version.outputs.macos_artifact_name }}
    steps:
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version }}" } else { "${{ github.ref_name }}" }
          $versionMatch = [regex]::Match($tag, '^v(?<base>\d+\.\d+\.\d+)(?<suffix>-[0-9A-Za-z][0-9A-Za-z.-]*)?$')
          if (-not $versionMatch.Success) {
            throw "Version must use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease format, for example v0.1.0 or v0.1.1-beta.6."
          }

          $version = $versionMatch.Groups["base"].Value
          $suffix = $versionMatch.Groups["suffix"].Value
          $packageLabel = "$version$suffix"
          $isPrerelease = -not [string]::IsNullOrWhiteSpace($suffix)
          $windowsArtifactName = "MomentTrace-$packageLabel-win-x64"
          $macosArtifactName = "MomentTrace-$packageLabel-macos-arm64"

          "release_tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "package_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "package_label=$packageLabel" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "is_prerelease=$isPrerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "windows_artifact_name=$windowsArtifactName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "macos_artifact_name=$macosArtifactName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  build-windows:
    name: Build Windows release
    runs-on: windows-latest
    needs: prepare

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Import Windows signing certificate
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_PASSWORD)) {
            Write-Host "Windows signing secrets are not configured; release artifacts will be unsigned."
            return
          }

          $certPath = Join-Path $env:RUNNER_TEMP "momenttrace-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_SIGNING_PFX_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          "WINDOWS_SIGNING_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Remove-Item -LiteralPath $certPath -Force

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $signingArgs = @()
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_THUMBPRINT)) {
            $signingArgs += @(
              "-CertificateThumbprint", $env:WINDOWS_SIGNING_CERT_THUMBPRINT
            )
          }

          .\scripts\build-installer.ps1 `
            -Version "${{ needs.prepare.outputs.package_label }}" `
            -AssemblyVersion "${{ needs.prepare.outputs.package_version }}" `
            -PublishDir ".\artifacts\${{ needs.prepare.outputs.windows_artifact_name }}" `
            -OutputDir ".\dist" `
            @signingArgs

      - name: Package Windows portable zip
        shell: pwsh
        run: |
          Compress-Archive `
            -Path ".\artifacts\${{ needs.prepare.outputs.windows_artifact_name }}\*" `
            -DestinationPath ".\dist\${{ needs.prepare.outputs.windows_artifact_name }}.zip" `
            -Force

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.windows_artifact_name }}
          path: |
            .\dist\${{ needs.prepare.outputs.windows_artifact_name }}.zip
            .\dist\MomentTrace-${{ needs.prepare.outputs.package_label }}-win-x64-setup.exe

  build-macos:
    name: Build macOS release
    runs-on: macos-latest
    needs: prepare

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build macOS app bundle
        shell: pwsh
        run: |
          ./scripts/build-macos-app.ps1 `
            -Version "${{ needs.prepare.outputs.package_label }}" `
            -AssemblyVersion "${{ needs.prepare.outputs.package_version }}" `
            -PublishDir "./artifacts/${{ needs.prepare.outputs.macos_artifact_name }}-publish" `
            -OutputDir "./dist"

          Move-Item `
            -LiteralPath "./dist/MomentTrace-${{ needs.prepare.outputs.package_label }}-macos-arm64.zip" `
            -Destination "./dist/${{ needs.prepare.outputs.macos_artifact_name }}.zip" `
            -Force

      - name: Upload macOS release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.macos_artifact_name }}
          path: ./dist/${{ needs.prepare.outputs.macos_artifact_name }}.zip

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-windows
      - build-macos

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $notes = @"
          MomentTrace ${{ needs.prepare.outputs.release_tag }}

          This prerelease includes Windows and macOS builds of the Avalonia desktop shell.

          Windows:
          - Install with the setup executable.
          - Or extract the portable zip and run MomentTrace.Desktop.exe.

          macOS:
          - Extract the macOS zip and run MomentTrace.app.
          - The macOS build is currently unsigned unless Developer ID signing secrets are added later.
          "@

          $releaseArgs = @()
          if ("${{ needs.prepare.outputs.is_prerelease }}" -eq "True") {
            $releaseArgs += "--prerelease"
          }

          gh release create "${{ needs.prepare.outputs.release_tag }}" `
            "./dist/MomentTrace-${{ needs.prepare.outputs.package_label }}-win-x64-setup.exe" `
            "./dist/${{ needs.prepare.outputs.windows_artifact_name }}.zip" `
            "./dist/${{ needs.prepare.outputs.macos_artifact_name }}.zip" `
            --title "MomentTrace ${{ needs.prepare.outputs.release_tag }}" `
            --notes $notes `
            --target "${{ github.sha }}" `
            @releaseArgs
